spring.application.name=task-reminder
server.port=8080

# Tasks are stored in a file database in your home folder, so they survive restarts.
spring.datasource.url=jdbc:h2:file:${user.home}/.task-reminder/tasks;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Reminder behaviour
# Show a pop-up dialog that stays on screen until dismissed (in addition to the banner notification)
reminder.show-dialog=true
# macOS notification sound (Glass, Ping, Hero, Submarine, ...)
reminder.sound=Glass
# Read the task aloud (macOS "say")
reminder.speak=false
# If the computer was asleep at the exact minute, still remind within this many minutes
reminder.grace-minutes=10
# Open the web page in your browser when the app starts
reminder.open-browser=true
